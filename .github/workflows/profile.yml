name: profile

on:
  schedule:
    - cron: "23 6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TILE_DIR: ${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: bash

    steps:
      - name: check out main (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: snake (Platane/snk v3.5.0)
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#fed7aa&color_dots=#292016,#642708,#92400e,#d97706,#fbbf24
            dist/snake-light.svg?color_snake=#7c2d12&color_dots=#ebedf0,#fde68a,#fbbf24,#d97706,#92400e

      - name: keep pacman from phoning home
        run: echo "127.0.0.1 elec.abozanona.me" | sudo tee -a /etc/hosts

      - name: pacman (abozanona/pacman-contribution-graph v5.3.2)
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman

      - name: game of life (satomasahiro2005/contribution-life v1.1.0)
        uses: satomasahiro2005/contribution-life@0414ddb7cf15f7cea7de8d0f0ff38001632aefa4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          login: ${{ github.repository_owner }}
          layout: calendar
          out_dir: dist
          name: life-raw

      - name: move the tiles into the run folder
        run: |
          mkdir -p "dist/$TILE_DIR"
          mv dist/*-contribution-graph-dark.svg "dist/$TILE_DIR/game.svg"
          mv dist/*-contribution-graph.svg "dist/$TILE_DIR/game-light.svg"
          mv dist/life-raw-dark.svg "dist/$TILE_DIR/life.svg"
          mv dist/life-raw.svg "dist/$TILE_DIR/life-light.svg"
          mv dist/snake.svg dist/snake-light.svg "dist/$TILE_DIR/"

      - name: build the cards and the README panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARD_PALETTE: blueprint-amber
        run: python3 gen.py

      - name: align the four calendars
        run: python3 gen.py --retile

      - name: set the bot as the git author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: carry over the files still in use
        run: |
          git show origin/output:profile.webp > dist/profile.webp 2>/dev/null || rm -f dist/profile.webp
          git show HEAD:README.md \
            | { grep -o "raw.githubusercontent.com/${GITHUB_REPOSITORY}/output/[^\"' )?]*" || true; } \
            | sed 's#.*/output/##' | sort -u \
            | while read -r file; do
                [ -e "dist/$file" ] && continue
                mkdir -p "dist/$(dirname "$file")"
                git show "origin/output:$file" > "dist/$file" 2>/dev/null || rm -f "dist/$file"
              done

      - name: publish the tiles
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git add -A
          git commit -qm "profile assets"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output

      - name: publish the README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet -- README.md && exit 0
          base=$(git rev-parse HEAD)
          git add README.md
          if [ "$(git log -1 --format=%ae)" = "$(git config user.email)" ] &&
             [ "$(git log -1 --format=%s)" = "refresh contributed-in panel [skip ci]" ]; then
            git commit -q --amend --no-edit
          else
            git commit -qm "refresh contributed-in panel [skip ci]"
          fi
          git push -q --force-with-lease=main:"$base" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: install playwright
        run: npm i --no-audit --no-fund playwright@1.62.1

      - name: take the picture
        env:
          TARGET_URL: https://github.com/${{ github.repository_owner }}
        run: node snapshot.mjs dist/profile.webp

      - name: publish the picture
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add profile.webp
          git diff --quiet --cached && exit 0
          git commit -qm "profile snapshot"
          git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
